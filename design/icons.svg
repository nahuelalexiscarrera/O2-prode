</symbol>

<!-- ─── DECORATIVE (for share card hero) ─────────────────────── -->
<symbol id="sol-de-mayo" viewBox="0 0 100 100">
  <defs>
    <radialGradient id="sun-grad">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="100%" stop-color="#FFB300"/>
    </radialGradient>
  </defs>
  <g>
    <!-- 16 alternating rays: 8 straight + 8 wavy -->
    <g fill="url(#sun-grad)">
      <polygon points="50,8 47,30 53,30"/>
      <polygon points="50,92 47,70 53,70"/>
      <polygon points="8,50 30,47 30,53"/>
      <polygon points="92,50 70,47 70,53"/>
      <polygon points="20,20 35,32 32,35"/>
      <polygon points="80,80 65,68 68,65"/>
      <polygon points="80,20 68,35 65,32"/>
      <polygon points="20,80 32,65 35,68"/>
    </g>
    <g fill="url(#sun-grad)" opacity="0.85">
      <path d="M50 14 Q 48 22, 52 30 Q 50 22, 50 14"/>
      <path d="M50 86 Q 48 78, 52 70 Q 50 78, 50 86"/>
      <path d="M14 50 Q 22 48, 30 52 Q 22 50, 14 50"/>
      <path d="M86 50 Q 78 48, 70 52 Q 78 50, 86 50"/>
    </g>
    <circle cx="50" cy="50" r="18" fill="url(#sun-grad)" stroke="#E65100" stroke-width="0.5"/>
    <!-- Face -->
    <circle cx="44" cy="48" r="1.5" fill="#5D4037"/>
    <circle cx="56" cy="48" r="1.5" fill="#5D4037"/>
    <path d="M44 56 Q 50 60, 56 56" fill="none" stroke="#5D4037" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M48 52 Q 50 54, 52 52" fill="none" stroke="#5D4037" stroke-width="0.8"/>
  </g>
</symbol>

<symbol id="world-trophy" viewBox="0 0 200 320">
  <!--
    World Cup style trophy: figures lifting a globe
    Stylized, custom, gold gradient with metallic highlights
  -->
  <defs>
    <linearGradient id="gold-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="30%" stop-color="#FFB300"/>
      <stop offset="55%" stop-color="#F57C00"/>
      <stop offset="80%" stop-color="#FFB300"/>
      <stop offset="100%" stop-color="#FFE082"/>
    </linearGradient>
    <linearGradient id="gold-deep" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFCA28"/>
      <stop offset="100%" stop-color="#E65100"/>
    </linearGradient>
    <filter id="trophy-glow">
      <feGaussianBlur stdDeviation="6"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g filter="url(#trophy-glow)">
    <!-- Base pedestal (octagonal-ish) -->
    <path d="M60 300 L60 290 L65 285 L135 285 L140 290 L140 300 Z" fill="url(#gold-deep)"/>
    <path d="M55 285 L60 280 L140 280 L145 285 L140 290 L60 290 Z" fill="url(#gold-grad)"/>
    <!-- Plate where text would go -->
    <rect x="68" y="260" width="64" height="20" fill="#3E2723" stroke="url(#gold-grad)" stroke-width="0.8"/>
    <text x="100" y="274" font-family="Anton, Bebas Neue, Impact, sans-serif" font-size="11" fill="url(#gold-grad)" text-anchor="middle" letter-spacing="0.5">FIFA WORLD CUP</text>
    <!-- Tier base -->
    <path d="M55 260 L65 250 L135 250 L145 260 L140 280 L60 280 Z" fill="url(#gold-grad)"/>
    <path d="M65 250 L75 230 L125 230 L135 250 Z" fill="url(#gold-deep)"/>
    <!-- Twisting column / figures (abstract human shapes spiraling up) -->
    <path d="M75 230 C 70 200, 75 180, 85 165 C 80 150, 78 135, 85 120 C 75 105, 78 90, 90 78" fill="none" stroke="url(#gold-grad)" stroke-width="6" stroke-linecap="round"/>
    <path d="M125 230 C 130 200, 125 180, 115 165 C 120 150, 122 135, 115 120 C 125 105, 122 90, 110 78" fill="none" stroke="url(#gold-grad)" stroke-width="6" stroke-linecap="round"/>
    <!-- Middle connection -->
    <ellipse cx="100" cy="155" rx="12" ry="6" fill="url(#gold-deep)"/>
    <!-- Globe top -->
    <circle cx="100" cy="58" r="32" fill="url(#gold-grad)" stroke="url(#gold-deep)" stroke-width="1.5"/>
    <!-- Globe meridians/equator -->
    <ellipse cx="100" cy="58" rx="32" ry="10" fill="none" stroke="url(#gold-deep)" stroke-width="1.2"/>
    <ellipse cx="100" cy="58" rx="18" ry="32" fill="none" stroke="url(#gold-deep)" stroke-width="1.2"/>
    <ellipse cx="100" cy="58" rx="10" ry="32" fill="none" stroke="url(#gold-deep)" stroke-width="0.8" opacity="0.6"/>
    <ellipse cx="100" cy="58" rx="26" ry="32" fill="none" stroke="url(#gold-deep)" stroke-width="0.8" opacity="0.6"/>
    <!-- Continent suggestion -->
    <path d="M88 50 Q 95 45, 105 50 Q 112 55, 108 62 Q 100 68, 92 64 Q 85 58, 88 50" fill="url(#gold-deep)" opacity="0.5"/>
    <!-- Highlight gloss -->
    <ellipse cx="92" cy="48" rx="8" ry="14" fill="white" opacity="0.18"/>
  </g>
</symbol>

